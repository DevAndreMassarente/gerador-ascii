[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gerador-ascii"
version = "2.0.0"
description = "Gerador de arte ASCII, ANSI, half-block e Braille a partir de imagens"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10",
]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
gerador-ascii = "image2ascii:main"

[tool.setuptools]
py-modules = ["image2ascii"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
